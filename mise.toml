[tools]
go = "1.27.1"
actionlint = "1.7.12"
gitleaks = "8.30.1"
goreleaser = "2.18.1"
shellcheck = "0.11.0"
"npm:prettier" = "3.6.2"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.6.0"

[tasks.ci]
description = "Run the complete local CI suite"
run = "sh scripts/ci.sh"

[tasks.build]
description = "Build the read-only apfsusage prototype"
run = "go build -buildvcs=false -o bin/apfsusage ./cmd/apfsusage"

[tasks.test]
description = "Run tests with the race detector"
run = "go test -buildvcs=false -race ./..."

[tasks.vet]
description = "Run Go static analysis"
run = "go vet -buildvcs=false ./..."

[tasks."release:check"]
description = "Validate the GoReleaser configuration"
run = "goreleaser check"

[tasks."release:snapshot"]
description = "Build local release artifacts without publishing"
run = "goreleaser release --snapshot --clean"

[tasks."release:publish"]
description = "Publish a tagged release (intended for GitHub Actions)"
run = "goreleaser release --clean"
